spring:
  application:
    name: fds-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fds}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 2500
      max-lifetime: 1800000
      leak-detection-threshold: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath*:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 3

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:super-secret-change-me-super-secret-change-me}
    access-token-minutes: 30
    refresh-token-days: 30
  upload-dir: ${UPLOAD_DIR:./storage}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
